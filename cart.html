<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - FreshMart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"> 
                <a href="index.html" class="logo-link">
                    <div class="logo-mark">
                        <div class="logo-leaf"></div>
                        <div class="logo-bag">
                            <div class="bag-handle"></div>
                        </div>
                    </div>
                    <div class="logo-text">
                        <span class="logo-brand">FreshMart</span>
                        <span class="logo-tagline">Farm Fresh Daily</span>
                    </div>
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="cart.html" class="cart-link active">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cartBadge">0</span>
                </a>
                <div class="search-wrapper">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search products..." autocomplete="off">
                    </div>
                    <div class="search-results" id="searchResults"></div>
                </div>
                <a href="login.html" class="login-link">
                    <i class="fas fa-user"></i> Login
                </a>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="cart-section">
        <div class="container">
            <h2 class="section-title">Your Shopping Cart</h2>
            <div id="cartContainer">
                <div class="cart-items" id="cartItems">
                    <!-- Cart items rendered by JS -->
                </div>
                <div class="cart-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="cartSubtotal">₹0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (5%):</span>
<span id="cartTax">₹0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
<span id="cartTotal">₹0.00</span>
                    </div>
                    <button class="checkout-btn" onclick="alert('Checkout feature coming soon!')">Proceed to Checkout</button>
                    <button class="continue-btn" onclick="window.location.href='index.html'">Continue Shopping</button>
                </div>
            </div>
            <div class="empty-cart" id="emptyCart" style="display: none;">
                <i class="fas fa-shopping-basket"></i>
                <p>Your cart is empty!</p>
                <a href="index.html" class="btn-primary">Start Shopping</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 FreshMart. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
